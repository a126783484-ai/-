name: Smoke Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/smoke/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/smoke-tests.yml'
  workflow_dispatch:

concurrency:
  group: smoke-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Resolve Supabase env
        shell: bash
        run: |
          node <<SUPABASE_ENV >> "$GITHUB_ENV"
          const fs = require("fs");
          const text = fs.readFileSync("src/lib/supabase.ts", "utf8");
          const url = text.match(/const EXPECTED_PRODUCTION_SUPABASE_URL = \"([^\"]+)\";/)?.[1];
          const key = text.match(/const EXPECTED_PRODUCTION_SUPABASE_ANON_KEY = \"([^\"]+)\";/)?.[1];
          if (!url || !key) process.exit(1);
          console.log("NEXT_PUBLIC_SUPABASE_URL=" + url);
          console.log("NEXT_PUBLIC_SUPABASE_ANON_KEY=" + key);
          console.log("SUPABASE_URL=" + url);
          console.log("SUPABASE_ANON_KEY=" + key);
          SUPABASE_ENV
      - name: Start app
        run: |
          npm run dev > smoke-server.log 2>&1 &
          npx wait-on http://127.0.0.1:3000

      - name: Run smoke tests
        env:
          CI: true
          SMOKE_BASE_URL: http://127.0.0.1:3000
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            smoke-server.log
