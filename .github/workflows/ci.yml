name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main, initial-beauty-nail-os]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm config get registry
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/quality-gate.mjs
      - name: Build
        shell: bash
        run: |
          mapfile -t supabase_env < <(node - <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync("src/lib/supabase.ts", "utf8");
          const url = text.match(/const EXPECTED_PRODUCTION_SUPABASE_URL = "([^"]+)";/)?.[1];
          const key = text.match(/const EXPECTED_PRODUCTION_SUPABASE_ANON_KEY = "([^"]+)";/)?.[1];
          if (!url || !key) process.exit(1);
          console.log(url);
          console.log(key);
          NODE
          )
          NEXT_PUBLIC_SUPABASE_URL="${supabase_env[0]}" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="${supabase_env[1]}" \
          SUPABASE_URL="${supabase_env[0]}" \
          SUPABASE_ANON_KEY="${supabase_env[1]}" \
          npm run build
