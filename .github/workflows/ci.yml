name: CI

on:
  pull_request:
  push:
    branches: [main, initial-beauty-nail-os]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://odzxyhaoehvhfximnwjh.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kenh5aGFvZWh2aGZ4aW1ud2poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MTEzMzcsImV4cCI6MjA5NDA4NzMzN30.MoUPUR1Fsjh3LqScqHqtGs008fH26orpekYQji5D--o
      SUPABASE_URL: https://odzxyhaoehvhfximnwjh.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kenh5aGFvZWh2aGZ4aW1ud2poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MTEzMzcsImV4cCI6MjA5NDA4NzMzN30.MoUPUR1Fsjh3LqScqHqtGs008fH26orpekYQji5D--o
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm config get registry
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/quality-gate.mjs
      - name: Build
        shell: bash
        run: |
          mapfile -t supabase_env < <(node - <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync("src/lib/supabase.ts", "utf8");
          const url = text.match(/const EXPECTED_PRODUCTION_SUPABASE_URL = "([^"]+)";/)?.[1];
          const key = text.match(/const EXPECTED_PRODUCTION_SUPABASE_ANON_KEY = "([^"]+)";/)?.[1];
          if (!url || !key) process.exit(1);
          console.log(url);
          console.log(key);
          NODE
          )
          NEXT_PUBLIC_SUPABASE_URL="${supabase_env[0]}" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="${supabase_env[1]}" \
          SUPABASE_URL="${supabase_env[0]}" \
          SUPABASE_ANON_KEY="${supabase_env[1]}" \
          npm run build
