name: Production Supervisor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: production-supervisor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supervise:
    name: Scheduled production supervision
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production guard
        run: npm run guard:production
        continue-on-error: true

      - name: Open or update supervision issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'production-guard-report.json';
            if (!fs.existsSync(path)) {
              core.setFailed('production-guard-report.json was not generated.');
              return;
            }

            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const findings = report.findings || [];
            const actionable = findings.filter((item) => item.level === 'error' || item.level === 'warn');
            const title = '[Production Supervisor] Active production risks';
            const labels = ['production-supervisor', 'automated'];

            const lines = [];
            lines.push('## Beauty OS Production Supervisor');
            lines.push('');
            lines.push(`Last run: ${report.generatedAt}`);
            lines.push('');
            lines.push(`Errors: ${report.counts?.error || 0}`);
            lines.push(`Warnings: ${report.counts?.warn || 0}`);
            lines.push(`Info: ${report.counts?.info || 0}`);
            lines.push('');
            lines.push('This issue is automatically maintained by the scheduled Production Supervisor workflow.');
            lines.push('It keeps production risks visible and reduces repeated AI audit work.');
            lines.push('');

            if (actionable.length === 0) {
              lines.push('No active blocking or warning-level production risks detected.');
            } else {
              lines.push('### Actionable findings');
              lines.push('');
              for (const item of actionable) {
                lines.push(`#### ${item.level.toUpperCase()} — ${item.code}`);
                lines.push('');
                lines.push(item.message || 'No message provided.');
                if (item.files?.length) lines.push(`\nFiles: ${item.files.join(', ')}`);
                if (item.suggestion) lines.push(`\nSuggested action: ${item.suggestion}`);
                if (item.aiPrompt) {
                  lines.push('\nAI handoff prompt:');
                  lines.push('```text');
                  lines.push(item.aiPrompt);
                  lines.push('```');
                }
                lines.push('');
              }
            }

            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'production-supervisor',
              per_page: 20
            });
            const issue = existing.data.find((item) => item.title === title);

            if (actionable.length === 0) {
              if (issue) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
              }
              await core.summary.addRaw(body).write();
              return;
            }

            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels });
            }

            await core.summary.addRaw(body).write();
