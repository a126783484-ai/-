name: Production Supervisor

# SAFE MODE:
# This supervisor is intentionally manual and report-only.
# It must not create AI repair issues, command queues, PRs, or deployment actions.
# Re-enable scheduled supervision only after human review confirms the automation boundaries.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-supervisor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supervise:
    name: Manual production supervision report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production guard in report-only mode
        run: npm run guard:production
        continue-on-error: true

      - name: Publish report summary only
        run: |
          echo "## Beauty OS Production Supervisor" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: manual report-only" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow does not create issues, PRs, AI repair tasks, command queue entries, or deployments." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f production-guard-report.json ]; then
            echo "production-guard-report.json generated." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat production-guard-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "production-guard-report.json was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
