name: PR Risk Review

on:
  pull_request:
    branches:
      - main

jobs:
  classify-risk:
    name: Classify PR production risk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect changed files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/${BASE_REF}...HEAD" > changed-files.txt
          cat changed-files.txt

      - name: Run production guard
        run: npm run guard:production
        continue-on-error: true

      - name: Run PR risk classifier
        run: |
          export CHANGED_FILES="$(cat changed-files.txt)"
          node scripts/pr-risk-classifier.mjs

      - name: Apply labels and comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('pr-risk-report.json', 'utf8'));
            const labels = report.labels || [];
            const body = [];

            body.push('## Automated PR Risk Classification');
            body.push('');
            body.push('This PR was automatically classified to reduce repeated AI analysis and improve engineering coordination.');
            body.push('');
            body.push(`Labels: ${labels.join(', ') || 'none'}`);
            body.push('');

            for (const [label, items] of Object.entries(report.categories || {})) {
              body.push(`### ${label}`);
              body.push('');
              for (const item of items) {
                body.push(`- ${item.file}`);
                body.push(`  - ${item.reason}`);
              }
              body.push('');
            }

            if (report.guardCounts) {
              body.push('### Production Guard Summary');
              body.push('');
              body.push(`- Errors: ${report.guardCounts.error || 0}`);
              body.push(`- Warnings: ${report.guardCounts.warn || 0}`);
              body.push(`- Info: ${report.guardCounts.info || 0}`);
            }

            const issue_number = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels
              });
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: body.join('\n')
            });
