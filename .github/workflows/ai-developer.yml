name: AI Developer Automation

# Disabled by request.
# The always-on AI developer loop is intentionally off.
# Supervision workflows such as AI Command Queue, Supabase Live Health,
# CI, security scans, and production guards remain responsible for monitoring.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: AI Developer Automation is disabled
        run: echo "AI Developer Automation is disabled. Use supervision workflows only."
