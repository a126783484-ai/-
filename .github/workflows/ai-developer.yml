name: AI Developer Automation (Legacy - Paused)

# PAUSED: AI automation is temporarily disabled to prevent unsafe self-repair,
# invalid file generation, automatic PR creation, or automatic merge on main.
# Re-enable only after scripts/ai-developer.mjs has validated path safety,
# risk gates, and human review requirements.

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'AI lane'
        required: false
        default: 'product'
        type: choice
        options:
          - engine
          - product
      run_mode:
        description: 'Run mode'
        required: false
        default: 'draft_pr'
        type: choice
        options:
          - draft_pr

permissions:
  contents: read

jobs:
  ai-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Automation paused
        run: echo "Legacy AI Developer workflow is paused for safety."
