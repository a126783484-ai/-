name: Supabase Live Health

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/**'
      - 'scripts/supabase-live-health.mjs'
      - '.github/workflows/supabase-live-health.yml'
  push:
    branches:
      - main
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

concurrency:
  group: supabase-live-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-live-health:
    name: Supabase live health
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.EXPECTED_SUPABASE_PROJECT_REF }}
      ENFORCE_SUPABASE_PROJECT_REF: ${{ vars.ENFORCE_SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run Supabase live health
        run: node scripts/supabase-live-health.mjs
