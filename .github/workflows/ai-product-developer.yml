name: AI Product Developer

# PAUSED:
# Product automation is temporarily disabled by owner request.
# Keep workflow_dispatch visible, but do not run product agent jobs until re-enabled.
# Do not push main, merge PRs, edit AI Engine / repair flows, or create new PRs from this workflow.

on:
  workflow_dispatch:
    inputs:
      target_file:
        description: 'Allowed target file'
        required: false
        default: 'src/app/services/page.tsx'
        type: choice
        options:
          - src/app/services/page.tsx
          - src/app/page.tsx
          - src/components/ModuleViews.tsx

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-product-developer-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ai-product-develop:
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - name: Product automation paused
        run: echo "AI Product Developer workflow is paused by owner request."