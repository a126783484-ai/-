name: Sync Vercel Env

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-vercel-env.yml

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: a126783484-2182s-projects
      VERCEL_ORG_ID: team_yUAeyZBvygQMUAiBkjZvtHAg
      VERCEL_PROJECT_ID: prj_PLocj0NLT9Zoygol5qCRqPyFlvAa
      TARGET_SUPABASE_PROJECT_REF: odzxyhaoehvhfximnwjh
      TARGET_SUPABASE_URL: https://odzxyhaoehvhfximnwjh.supabase.co
      TARGET_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kenh5aGFvZWh2aGZ4aW1ud2poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MTEzMzcsImV4cCI6MjA5NDA4NzMzN30.MoUPUR1Fsjh3LqScqHqtGs008fH26orpekYQji5D--o
      TARGET_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dAql5aMJG_C2fqSBC-wdLA_vC5Z4jZg
    steps:
      - uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_SCOPE"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test "$TARGET_SUPABASE_URL" = "https://odzxyhaoehvhfximnwjh.supabase.co"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Replace Vercel production env
        run: |
          set -e
          add_env () {
            name="$1"
            value="$2"
            vercel env rm "$name" production --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" || true
            sleep 2
            printf "%s" "$value" | vercel env add "$name" production --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"
          }

          add_env NEXT_PUBLIC_SUPABASE_URL "$TARGET_SUPABASE_URL"
          add_env SUPABASE_URL "$TARGET_SUPABASE_URL"
          add_env NEXT_PUBLIC_SUPABASE_ANON_KEY "$TARGET_SUPABASE_ANON_KEY"
          add_env SUPABASE_ANON_KEY "$TARGET_SUPABASE_ANON_KEY"
          add_env SUPABASE_PUBLISHABLE_KEY "$TARGET_SUPABASE_PUBLISHABLE_KEY"
          add_env NEXT_PUBLIC_SUPABASE_PROJECT_REF "$TARGET_SUPABASE_PROJECT_REF"
          add_env SUPABASE_PROJECT_REF "$TARGET_SUPABASE_PROJECT_REF"

      - name: List production env after sync
        run: vercel env ls production --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"

      - name: Wait for Vercel env propagation
        run: sleep 45

      - name: Deploy production
        run: vercel deploy --prod --force --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"
