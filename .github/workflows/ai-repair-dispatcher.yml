name: AI Repair Dispatcher

on:
  workflow_run:
    workflows:
      - CI
      - Smoke Tests
      - Production Guard
      - Production Reviewer
      - PR Risk Review
    types:
      - completed
  workflow_dispatch:

jobs:
  dispatch-repair:
    name: Dispatch AI repair issue
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Create or update AI repair issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run || null;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const workflowName = run?.name || 'Manual dispatch';
            const runUrl = run?.html_url || `${context.serverUrl}/${owner}/${repo}/actions`;
            const headBranch = run?.head_branch || 'unknown';
            const headSha = run?.head_sha || 'unknown';
            const conclusion = run?.conclusion || 'manual';
            const event = run?.event || context.eventName;
            const prNumber = run?.pull_requests?.[0]?.number || null;

            const labels = ['ai-repair', 'automated'];
            if (workflowName.includes('Smoke')) labels.push('risk:runtime-smoke');
            if (workflowName.includes('Guard')) labels.push('risk:production-guard');
            if (workflowName.includes('CI')) labels.push('risk:ci');
            if (workflowName.includes('Risk')) labels.push('risk:classification');

            const title = `[AI Repair] ${workflowName} failed on ${headBranch}`;

            const prompt = [
              'You are repairing a failed Beauty OS automation workflow.',
              '',
              'Rules:',
              '- Do not merge automatically.',
              '- Do not deploy production.',
              '- Do not modify unrelated files.',
              '- Use the smallest safe fix.',
              '- Read the linked workflow run first.',
              '- Identify root cause before editing.',
              '- Run targeted verification only.',
              '- Report changed files, tests run, remaining risk.',
              '',
              `Workflow: ${workflowName}`,
              `Run: ${runUrl}`,
              `Branch: ${headBranch}`,
              `SHA: ${headSha}`,
              prNumber ? `PR: #${prNumber}` : 'PR: none detected',
              '',
              'Expected output:',
              '1. root cause',
              '2. smallest safe fix',
              '3. modified files',
              '4. verification result',
              '5. whether this is merge-safe'
            ].join('\n');

            const body = [
              '## AI Repair Dispatch',
              '',
              'This issue was created automatically because a production/CI/smoke workflow failed.',
              '',
              `- Workflow: **${workflowName}**`,
              `- Conclusion: **${conclusion}**`,
              `- Event: **${event}**`,
              `- Branch: **${headBranch}**`,
              `- SHA: ${headSha}`,
              prNumber ? `- PR: #${prNumber}` : '- PR: not detected',
              `- Run: ${runUrl}`,
              '',
              '### AI repair prompt',
              '',
              '```text',
              prompt,
              '```',
              '',
              '### Human approval gates',
              '',
              '- Merge requires human approval.',
              '- Production deploy requires human approval.',
              '- Remote database migration requires human approval.',
              '- Secret or env mutation requires human approval.',
              '',
              '### Goal',
              '',
              'Reduce Codex/OpenCode token usage by giving the AI implementer a precise repair packet instead of asking it to rediscover the failure context.'
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'ai-repair',
              per_page: 50
            });

            const issue = existing.data.find((item) => item.title === title);

            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body, labels });
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Updated repair context from latest failed run: ${runUrl}` });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels });
            }
