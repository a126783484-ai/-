<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beauty OS Engineering Dashboard</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f7f2ee; color: #251b22; }
    header { padding: 20px; background: #3b2238; color: white; }
    main { padding: 16px; display: grid; gap: 16px; max-width: 1100px; margin: 0 auto; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .card { background: white; border: 1px solid #eaded8; border-radius: 18px; padding: 16px; box-shadow: 0 8px 24px rgba(35, 22, 32, 0.08); }
    .title { margin: 0 0 6px; font-size: 18px; font-weight: 800; }
    .muted { color: #7d6f77; font-size: 13px; }
    .status { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 9px; font-size: 12px; font-weight: 700; }
    .success { background: #e7f8ee; color: #116b38; }
    .failure { background: #fde9e9; color: #a32020; }
    .progress { background: #fff5d7; color: #8a5b00; }
    .neutral { background: #eee9f1; color: #4c3b4e; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eee4df; vertical-align: top; }
    a { color: #6d2f6f; font-weight: 700; text-decoration: none; }
    button { border: 0; border-radius: 12px; background: #3b2238; color: white; padding: 10px 14px; font-weight: 800; }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .danger { color: #a32020; font-weight: 800; }
  </style>
</head>
<body>
  <header>
    <h1>Beauty OS Engineering Dashboard</h1>
    <p>PR、Actions、Supervisor、Repair Issues 即時只讀狀態</p>
  </header>
  <main>
    <section class="card toolbar">
      <button id="refresh">重新整理</button>
      <span id="updated" class="muted">尚未載入</span>
      <span class="muted">Repo: Johnnie1266789/beauty-os</span>
    </section>

    <section class="grid">
      <div class="card"><p class="title" id="open-pr-count">-</p><p class="muted">Open PRs</p></div>
      <div class="card"><p class="title" id="failed-run-count">-</p><p class="muted">Recent Failed Runs</p></div>
      <div class="card"><p class="title" id="repair-count">-</p><p class="muted">AI Repair Issues</p></div>
      <div class="card"><p class="title" id="supervisor-count">-</p><p class="muted">Supervisor Issues</p></div>
    </section>

    <section class="card">
      <h2>Next Best Action</h2>
      <p id="next-action" class="muted">載入中...</p>
    </section>

    <section class="card">
      <h2>Open PRs</h2>
      <div id="prs">載入中...</div>
    </section>

    <section class="card">
      <h2>Recent Workflow Runs</h2>
      <div id="runs">載入中...</div>
    </section>

    <section class="card">
      <h2>Automation Issues</h2>
      <div id="issues">載入中...</div>
    </section>
  </main>

  <script>
    const owner = 'Johnnie1266789';
    const repo = 'beauty-os';
    const api = 'https://api.github.com/repos/' + owner + '/' + repo;

    function statusClass(value) {
      if (value === 'success' || value === true) return 'success';
      if (value === 'failure' || value === false || value === 'cancelled') return 'failure';
      if (value === 'in_progress' || value === 'queued') return 'progress';
      return 'neutral';
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    }

    async function fetchJson(url) {
      const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' }});
      if (!res.ok) throw new Error(res.status + ' ' + res.statusText + ' for ' + url);
      return res.json();
    }

    function renderTable(headers, rows) {
      if (!rows.length) return '<p class="muted">沒有資料</p>';
      return '<table><thead><tr>' + headers.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
    }

    async function load() {
      document.getElementById('updated').textContent = '載入中...';
      try {
        const [prs, runs, repairIssues, supervisorIssues] = await Promise.all([
          fetchJson(api + '/pulls?state=open&per_page=20'),
          fetchJson(api + '/actions/runs?per_page=20'),
          fetchJson(api + '/issues?state=open&labels=ai-repair&per_page=20'),
          fetchJson(api + '/issues?state=open&labels=production-supervisor&per_page=20')
        ]);

        const workflowRuns = runs.workflow_runs || [];
        const failedRuns = workflowRuns.filter(r => r.conclusion === 'failure');

        document.getElementById('open-pr-count').textContent = prs.length;
        document.getElementById('failed-run-count').textContent = failedRuns.length;
        document.getElementById('repair-count').textContent = repairIssues.length;
        document.getElementById('supervisor-count').textContent = supervisorIssues.length;

        if (failedRuns[0]) {
          document.getElementById('next-action').innerHTML = '優先處理失敗 workflow：<a target="_blank" href="' + failedRuns[0].html_url + '">' + esc(failedRuns[0].name) + '</a>';
        } else if (prs[0]) {
          document.getElementById('next-action').innerHTML = '檢查最新 PR：<a target="_blank" href="' + prs[0].html_url + '">#' + prs[0].number + ' ' + esc(prs[0].title) + '</a>';
        } else {
          document.getElementById('next-action').textContent = '目前沒有立即工程阻塞。';
        }

        document.getElementById('prs').innerHTML = renderTable(['PR', 'Title', 'Branch', 'Draft', 'Updated'], prs.map(pr =>
          '<tr><td><a target="_blank" href="' + pr.html_url + '">#' + pr.number + '</a></td><td>' + esc(pr.title) + '</td><td>' + esc(pr.head.ref) + '</td><td><span class="status ' + statusClass(!pr.draft) + '">' + (pr.draft ? 'draft' : 'ready') + '</span></td><td>' + esc(pr.updated_at) + '</td></tr>'
        ));

        document.getElementById('runs').innerHTML = renderTable(['Workflow', 'Status', 'Conclusion', 'Branch', 'Updated'], workflowRuns.slice(0, 12).map(run =>
          '<tr><td><a target="_blank" href="' + run.html_url + '">' + esc(run.name) + '</a></td><td><span class="status ' + statusClass(run.status) + '">' + esc(run.status) + '</span></td><td><span class="status ' + statusClass(run.conclusion) + '">' + esc(run.conclusion || '-') + '</span></td><td>' + esc(run.head_branch || '-') + '</td><td>' + esc(run.updated_at) + '</td></tr>'
        ));

        const allIssues = [...repairIssues, ...supervisorIssues].filter((item, index, arr) => arr.findIndex(other => other.number === item.number) === index);
        document.getElementById('issues').innerHTML = renderTable(['Issue', 'Title', 'Labels', 'Updated'], allIssues.map(issue =>
          '<tr><td><a target="_blank" href="' + issue.html_url + '">#' + issue.number + '</a></td><td>' + esc(issue.title) + '</td><td>' + esc(issue.labels.map(l => l.name).join(', ')) + '</td><td>' + esc(issue.updated_at) + '</td></tr>'
        ));

        document.getElementById('updated').textContent = '最後更新：' + new Date().toLocaleString();
      } catch (error) {
        document.getElementById('next-action').innerHTML = '<span class="danger">載入失敗：' + esc(error.message) + '</span>';
        document.getElementById('updated').textContent = '載入失敗';
      }
    }

    document.getElementById('refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
